<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="brBgGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#FF7900" stop-opacity="0.24" />
      <stop offset="50%" stop-color="#FF9A32" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#08090B" stop-opacity="0" />
    </radialGradient>

    <!-- Platform Gradient -->
    <radialGradient id="brPlatGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242A38" />
      <stop offset="70%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0A0C10" />
    </radialGradient>

    <!-- Gold Crest Gradient -->
    <linearGradient id="brCrestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0" />
      <stop offset="40%" stop-color="#FFB300" />
      <stop offset="80%" stop-color="#FF7900" />
      <stop offset="100%" stop-color="#B84200" />
    </linearGradient>

    <!-- Number Gradient -->
    <linearGradient id="brNumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="brGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="brShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="480" height="360" fill="#0C0E14" />
  <rect width="480" height="360" fill="url(#brBgGlow)" />

  <!-- Floor Glow & Platform -->
  <ellipse cx="240" cy="295" rx="160" ry="32" fill="#FF7900" opacity="0.14" filter="url(#brGlow)" />
  <ellipse cx="240" cy="290" rx="145" ry="26" fill="url(#brPlatGrad)" stroke="#FF9A32" stroke-width="1.6" />
  <ellipse cx="240" cy="290" rx="120" ry="19" fill="none" stroke="rgba(255,154,50,0.25)" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Subtle Precision Decal Alignment Grid -->
  <g opacity="0.25">
    <line x1="80" y1="170" x2="400" y2="170" stroke="#FF7900" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="240" y1="50" x2="240" y2="280" stroke="#FF7900" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="240" cy="170" r="90" fill="none" stroke="#FF7900" stroke-width="1" stroke-dasharray="3 6" />
  </g>

  <!-- Background Jersey Chest Cutout -->
  <g transform="translate(160, 48)" opacity="0.45">
    <path d="M 20 20 Q 80 42 140 20 L 165 60 L 140 70 L 138 200 Q 80 210 22 200 L 20 70 L -5 60 Z" fill="#141824" stroke="rgba(255,121,0,0.4)" stroke-width="1.5" />
    <path d="M 40 24 Q 80 50 120 24" fill="none" stroke="#FF7900" stroke-width="1.8" />
  </g>

  <!-- Vector Crest Shield Badge (Left Chest) -->
  <g transform="translate(85, 75)" filter="url(#brShadow)">
    <!-- Bounding Box Selection Handles -->
    <rect x="-8" y="-8" width="106" height="116" rx="6" fill="rgba(255,121,0,0.08)" stroke="#FF7900" stroke-width="1.2" stroke-dasharray="3 3" />
    <!-- 4 Orange Handle Dots -->
    <circle cx="-8" cy="-8" r="4" fill="#FF7900" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="98" cy="-8" r="4" fill="#FF7900" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="-8" cy="108" r="4" fill="#FF7900" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="98" cy="108" r="4" fill="#FF7900" stroke="#FFFFFF" stroke-width="1.2" />

    <!-- Center Rotation Target Handle -->
    <line x1="45" y1="-8" x2="45" y2="-22" stroke="#FF7900" stroke-width="1.2" />
    <circle cx="45" cy="-22" r="3.5" fill="#FF9A32" />

    <!-- Crest Shield Shape -->
    <path d="M 10 12 L 80 12 Q 80 62 45 92 Q 10 62 10 12 Z" fill="#1A1E2A" stroke="url(#brCrestGrad)" stroke-width="3" />
    <!-- Crest Inner Shield Graphic -->
    <path d="M 18 20 L 72 20 Q 72 58 45 82 Q 18 58 18 20 Z" fill="none" stroke="rgba(255,179,0,0.4)" stroke-width="1.5" />
    <!-- Crown / Falcon Wings Icon Inside Crest -->
    <path d="M 45 32 L 53 45 L 68 45 L 56 55 L 60 70 L 45 60 L 30 70 L 34 55 L 22 45 L 37 45 Z" fill="url(#brCrestGrad)" filter="url(#brGlow)" />

    <!-- Coordinate Tag -->
    <rect x="-12" y="118" width="114" height="18" rx="4" fill="#0C0E14" stroke="#FF7900" stroke-width="1" />
    <text x="45" y="130" fill="#FFA84A" font-size="8.5" font-family="-apple-system, BlinkMacSystemFont, monospace" font-weight="700" text-anchor="middle">X:142mm  Y:210mm</text>
  </g>

  <!-- Player Name & Varsity Number 10 (Main Chest / Back Presentation) -->
  <g transform="translate(230, 72)" filter="url(#brShadow)">
    <!-- Bounding Box Frame -->
    <rect x="-10" y="-8" width="168" height="155" rx="6" fill="rgba(255,121,0,0.06)" stroke="#FF9A32" stroke-width="1.2" stroke-dasharray="4 3" />
    <!-- Corner Pins -->
    <circle cx="-10" cy="-8" r="4" fill="#FF9A32" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="158" cy="-8" r="4" fill="#FF9A32" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="-10" cy="147" r="4" fill="#FF9A32" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="158" cy="147" r="4" fill="#FF9A32" stroke="#FFFFFF" stroke-width="1.2" />

    <!-- Player Name: VICTOR -->
    <text x="74" y="24" fill="#FFA84A" font-size="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" letter-spacing="3.5" text-anchor="middle" filter="url(#brGlow)">
      VICTOR
    </text>

    <!-- Athletic Number: 10 with Bevels -->
    <g transform="translate(18, 38)">
      <!-- Number 1 -->
      <path d="M 12 12 L 28 0 L 44 0 L 44 88 L 24 88 L 24 18 L 12 26 Z" fill="url(#brNumGrad)" stroke="#FF7900" stroke-width="2.2" />
      <!-- Number 0 -->
      <path d="M 64 0 L 102 0 Q 112 0 112 14 L 112 74 Q 112 88 102 88 L 64 88 Q 54 88 54 74 L 54 14 Q 54 0 64 0 Z M 74 20 L 74 68 L 92 68 L 92 20 Z" fill="url(#brNumGrad)" stroke="#FF7900" stroke-width="2.2" />
    </g>

    <!-- Dynamic Resolution Callout -->
    <rect x="18" y="132" width="112" height="18" rx="4" fill="#0C0E14" stroke="#FF7900" stroke-width="1" />
    <text x="74" y="144" fill="#E2E8F0" font-size="8.5" font-family="-apple-system, BlinkMacSystemFont, monospace" font-weight="700" text-anchor="middle">SVG VECTOR 4K UV</text>
  </g>

  <!-- Precision Measurement Caliper Across Numbers -->
  <g transform="translate(230, 240)">
    <line x1="8" y1="0" x2="140" y2="0" stroke="#FF7900" stroke-width="1.4" />
    <line x1="8" y1="-5" x2="8" y2="5" stroke="#FF7900" stroke-width="1.4" />
    <line x1="140" y1="-5" x2="140" y2="5" stroke="#FF7900" stroke-width="1.4" />
    <text x="74" y="-7" fill="#FFA84A" font-size="9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="middle">WIDTH: 260 mm</text>
  </g>

  <!-- Bottom Tech Badge -->
  <g transform="translate(130, 316)">
    <rect width="220" height="26" rx="13" fill="#141824" stroke="rgba(255,121,0,0.5)" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#FF7900" filter="url(#brGlow)" />
    <text x="30" y="17" fill="#E2E8F0" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" letter-spacing="0.5">
      DYNAMIC EMBLEM &amp; UV PLACEMENT
    </text>
  </g>
</svg>