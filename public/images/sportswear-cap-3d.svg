<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="tdBgGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#FF7900" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FF9A32" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#08090B" stop-opacity="0" />
    </radialGradient>

    <!-- Platform Gradient -->
    <radialGradient id="tdPlatGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242A38" />
      <stop offset="70%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0A0C10" />
    </radialGradient>

    <!-- Jersey Gradient -->
    <linearGradient id="tdJerseyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3345" />
      <stop offset="45%" stop-color="#1A1E29" />
      <stop offset="100%" stop-color="#0F121A" />
    </linearGradient>

    <!-- Orange Trim Gradient -->
    <linearGradient id="tdOrangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9A32" />
      <stop offset="100%" stop-color="#FF7900" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="tdGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Drop Shadow -->
    <filter id="tdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="480" height="360" fill="#0C0E14" />
  <rect width="480" height="360" fill="url(#tdBgGlow)" />

  <!-- Floor Ambient Glow & Platform -->
  <ellipse cx="240" cy="295" rx="160" ry="32" fill="#FF7900" opacity="0.14" filter="url(#tdGlow)" />
  <ellipse cx="240" cy="290" rx="145" ry="26" fill="url(#tdPlatGrad)" stroke="#FF9A32" stroke-width="1.75" filter="drop-shadow(0 0 12px rgba(255,121,0,0.45))" />
  <ellipse cx="240" cy="290" rx="120" ry="19" fill="none" stroke="rgba(255,154,50,0.3)" stroke-width="1" />

  <!-- 3D Orbit Ring (Behind Jersey) -->
  <g opacity="0.75">
    <ellipse cx="240" cy="165" rx="135" ry="50" fill="none" stroke="rgba(255,121,0,0.35)" stroke-width="1.5" stroke-dasharray="6 4" transform="rotate(-10 240 165)" />
    <!-- Rotation Arrow Heads -->
    <path d="M 365 140 L 375 148 L 362 153 Z" fill="#FF9A32" filter="url(#tdGlow)" />
    <path d="M 115 190 L 105 182 L 118 177 Z" fill="#FF9A32" filter="url(#tdGlow)" />
  </g>

  <!-- 3D Sportswear Athletic Jersey Product (Center) -->
  <g filter="url(#tdShadow)" transform="translate(240, 160)">
    <!-- Main Torso -->
    <path d="M -42 -75 C -28 -78, -15 -80, 0 -80 C 15 -80, 28 -78, 42 -75 C 50 -35, 54 15, 50 75 C 50 78, -50 78, -50 75 C -54 15, -50 -35, -42 -75 Z"
          fill="url(#tdJerseyGrad)" stroke="#384055" stroke-width="1.5" />

    <!-- Aerodynamic Orange Accent Chevrons -->
    <path d="M -34 -30 L -12 -12 L 0 -22 L 12 -12 L 34 -30 L 28 -42 L 12 -28 L 0 -36 L -12 -28 L -28 -42 Z"
          fill="url(#tdOrangeGrad)" opacity="0.95" filter="drop-shadow(0 0 6px rgba(255,121,0,0.5))" />

    <!-- Side Athletic Vent Stripes -->
    <path d="M -46 -20 Q -42 20 -44 65 L -38 65 Q -36 20 -40 -20 Z" fill="#FF7900" opacity="0.8" />
    <path d="M 46 -20 Q 42 20 44 65 L 38 65 Q 36 20 40 -20 Z" fill="#FF7900" opacity="0.8" />

    <!-- Collar Trim -->
    <path d="M -22 -78 C -14 -72, 14 -72, 22 -78 C 16 -84, -16 -84, -22 -78 Z" fill="#FF9A32" />

    <!-- Left & Right Sleeves with Lighting Contours -->
    <path d="M -42 -75 L -72 -42 L -60 -22 L -44 -45 Z" fill="#1E2330" stroke="#384055" stroke-width="1.2" />
    <path d="M 42 -75 L 72 -42 L 60 -22 L 44 -45 Z" fill="#282E3E" stroke="#384055" stroke-width="1.2" />

    <!-- Sleeve Orange Cuffs -->
    <path d="M -72 -42 L -68 -36 L -56 -16 L -60 -22 Z" fill="#FF7900" />
    <path d="M 72 -42 L 68 -36 L 56 -16 L 60 -22 Z" fill="#FF7900" />
  </g>

  <!-- 3D Orbit Ring (In Front of Jersey) -->
  <g filter="url(#tdGlow)">
    <path d="M 115 165 C 130 205, 350 205, 365 165" fill="none" stroke="#FF7900" stroke-width="2.5" />
    <circle cx="240" cy="202" r="5" fill="#FFFFFF" stroke="#FF7900" stroke-width="2" />
  </g>

  <!-- 360° Interactive Rotation Floating Badge -->
  <g transform="translate(240, 68)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.6))">
    <rect x="-56" y="-13" width="112" height="26" rx="13" fill="rgba(14, 16, 23, 0.9)" stroke="#FF7900" stroke-width="1.2" />
    <!-- 360 Icon -->
    <path d="M -40 -1 A 6 6 0 1 1 -34 3 L -31 0" fill="none" stroke="#FF9A32" stroke-width="1.4" stroke-linecap="round" />
    <text x="2" y="4" fill="#FFFFFF" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.5">360° ROTATION</text>
  </g>

  <!-- Lighting & Shadow Angle Callout Pin -->
  <g transform="translate(370, 95)" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))">
    <circle cx="0" cy="0" r="14" fill="#141824" stroke="#FF7900" stroke-width="1.5" />
    <!-- Sun / Lighting Ray Icon -->
    <circle cx="0" cy="0" r="4" fill="#FF9A32" />
    <line x1="0" y1="-8" x2="0" y2="-10" stroke="#FF9A32" stroke-width="1.5" stroke-linecap="round" />
    <line x1="6" y1="-6" x2="8" y2="-8" stroke="#FF9A32" stroke-width="1.5" stroke-linecap="round" />
    <line x1="8" y1="0" x2="10" y2="0" stroke="#FF9A32" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
