<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="athBgGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#FF7900" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#FF9A32" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#08090B" stop-opacity="0" />
    </radialGradient>

    <!-- Platform Radial Gradient -->
    <radialGradient id="athPlatformGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262C3A" />
      <stop offset="70%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0A0C10" />
    </radialGradient>

    <!-- Athletic Wear Body Gradient -->
    <linearGradient id="athBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252A38" />
      <stop offset="40%" stop-color="#191D26" />
      <stop offset="100%" stop-color="#0F1116" />
    </linearGradient>

    <!-- Honeycomb Texture Pattern -->
    <pattern id="honeycombPat" width="16" height="27.71" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 16 4.62 L 16 13.86 L 8 18.48 L 0 13.86 L 0 4.62 Z" fill="none" stroke="rgba(255, 121, 0, 0.12)" stroke-width="0.8" />
      <path d="M 0 27.71 L 8 23.09 L 16 27.71" fill="none" stroke="rgba(255, 121, 0, 0.12)" stroke-width="0.8" />
    </pattern>

    <!-- Orange Neon Glow Filter -->
    <filter id="athOrangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="athShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="480" height="360" fill="#0C0E14" />
  <rect width="480" height="360" fill="url(#athBgGlow)" />

  <!-- Floor Ambient Light Pool -->
  <ellipse cx="240" cy="295" rx="160" ry="32" fill="#FF7900" opacity="0.12" filter="url(#athOrangeGlow)" />

  <!-- Illuminated Circular Display Platform -->
  <ellipse cx="240" cy="292" rx="140" ry="26" fill="url(#athPlatformGrad)" stroke="#FF9A32" stroke-width="1.75" filter="drop-shadow(0 0 12px rgba(255,121,0,0.45))" />
  <ellipse cx="240" cy="292" rx="115" ry="18" fill="none" stroke="rgba(255,154,50,0.3)" stroke-width="1" />

  <!-- Athletic Singlet / Compression Wear Artwork Group -->
  <g filter="url(#athShadow)" transform="translate(240, 155)">
    <!-- Main Body Shape -->
    <path d="M -38 -80 C -25 -82, -15 -85, 0 -85 C 15 -85, 25 -82, 38 -80 C 44 -40, 48 10, 48 76 C 48 78, -48 78, -48 76 C -48 10, -44 -40, -38 -80 Z"
          fill="url(#athBodyGrad)" stroke="#2C3242" stroke-width="1.5" />

    <!-- Honeycomb Pattern Fill Overlay on Torso -->
    <path d="M -38 -80 C -25 -82, -15 -85, 0 -85 C 15 -85, 25 -82, 38 -80 C 44 -40, 48 10, 48 76 C 48 78, -48 78, -48 76 C -48 10, -44 -40, -38 -80 Z"
          fill="url(#honeycombPat)" opacity="0.8" />

    <!-- Neckline Cutout & Orange Trim -->
    <path d="M -22 -83 C -14 -60, 14 -60, 22 -83 Z" fill="#0C0E14" />
    <path d="M -22 -83 C -14 -60, 14 -60, 22 -83" fill="none" stroke="#FF7900" stroke-width="2.5" stroke-linecap="round" filter="url(#athOrangeGlow)" />

    <!-- Left Armhole Cutout & Trim -->
    <path d="M -38 -80 C -26 -55, -26 -28, -44 -12" fill="none" stroke="#FF7900" stroke-width="2.5" stroke-linecap="round" filter="url(#athOrangeGlow)" />

    <!-- Right Armhole Cutout & Trim -->
    <path d="M 38 -80 C 26 -55, 26 -28, 44 -12" fill="none" stroke="#FF7900" stroke-width="2.5" stroke-linecap="round" filter="url(#athOrangeGlow)" />

    <!-- Aerodynamic Muscle Mapping Seams (Luminous Orange) -->
    <!-- Lat / Oblique Curved Lines -->
    <path d="M -42 0 Q -24 35 -38 72" fill="none" stroke="#FF9A32" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 42 0 Q 24 35 38 72" fill="none" stroke="#FF9A32" stroke-width="1.8" stroke-linecap="round" />

    <!-- Pectoral / Chest Arch Lines -->
    <path d="M -24 -24 Q 0 -12 24 -24" fill="none" stroke="rgba(255, 121, 0, 0.85)" stroke-width="1.8" stroke-linecap="round" />
    
    <!-- Core / Abdominal Compression Contours -->
    <path d="M -20 5 Q 0 16 20 5" fill="none" stroke="rgba(255, 154, 50, 0.7)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M -24 30 Q 0 42 24 30" fill="none" stroke="rgba(255, 154, 50, 0.7)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M -20 54 Q 0 64 20 54" fill="none" stroke="rgba(255, 154, 50, 0.7)" stroke-width="1.5" stroke-linecap="round" />

    <!-- Center Sternum Seam Line -->
    <line x1="0" y1="-50" x2="0" y2="72" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Center Chest Trikomi Brand Mark -->
    <g transform="translate(0, -38)">
      <polygon points="0,-8 -7,4 7,4" fill="#FF7900" filter="url(#athOrangeGlow)" />
      <polygon points="0,-4 -4,3 4,3" fill="#FFFFFF" />
    </g>

    <!-- Bottom Compression Hem Band -->
    <rect x="-48" y="70" width="96" height="8" rx="2" fill="#141720" stroke="#FF7900" stroke-width="1.2" opacity="0.9" />
  </g>
</svg>
