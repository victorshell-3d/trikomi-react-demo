<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="hoodieBgGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#FF7900" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#FF9A32" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#08090B" stop-opacity="0" />
    </radialGradient>

    <!-- Platform Radial Gradient -->
    <radialGradient id="hoodiePlatformGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262C3A" />
      <stop offset="70%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0A0C10" />
    </radialGradient>

    <!-- Hoodie Body Gradient -->
    <linearGradient id="hoodieBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232836" />
      <stop offset="40%" stop-color="#181B24" />
      <stop offset="100%" stop-color="#101218" />
    </linearGradient>

    <!-- Orange Neon Glow Filter -->
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="hoodieShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="480" height="360" fill="#0C0E14" />
  <rect width="480" height="360" fill="url(#hoodieBgGlow)" />

  <!-- Floor Ambient Light Pool -->
  <ellipse cx="240" cy="295" rx="160" ry="32" fill="#FF7900" opacity="0.12" filter="url(#orangeGlow)" />

  <!-- Illuminated Circular Display Platform -->
  <ellipse cx="240" cy="292" rx="140" ry="26" fill="url(#hoodiePlatformGrad)" stroke="#FF9A32" stroke-width="1.75" filter="drop-shadow(0 0 12px rgba(255,121,0,0.45))" />
  <ellipse cx="240" cy="292" rx="115" ry="18" fill="none" stroke="rgba(255,154,50,0.3)" stroke-width="1" />

  <!-- Hoodie Main Artwork Group -->
  <g filter="url(#hoodieShadow)" transform="translate(240, 155)">
    <!-- Behind Hood Shadow / Silhouette -->
    <path d="M -44 -68 C -44 -115, 44 -115, 44 -68 C 52 -35, -52 -35, -44 -68 Z" fill="#0E1015" />

    <!-- Hood Outer Shell -->
    <path d="M -48 -60 C -52 -118, 52 -118, 48 -60 C 44 -40, 36 -28, 0 -24 C -36 -28, -44 -40, -48 -60 Z"
          fill="url(#hoodieBodyGrad)" stroke="#2C3242" stroke-width="1.5" />

    <!-- Hood Inner Lining with Orange Piping -->
    <path d="M -34 -55 C -36 -100, 36 -100, 34 -55 C 30 -38, 0 -30, 0 -30 C 0 -30, -30 -38, -34 -55 Z"
          fill="#12151D" stroke="#FF7900" stroke-width="2" filter="url(#orangeGlow)" />

    <!-- Sleeves (Left & Right) -->
    <!-- Left Sleeve -->
    <path d="M -54 -38 L -94 28 C -98 34, -86 42, -80 38 L -50 0 L -50 50 Z"
          fill="url(#hoodieBodyGrad)" stroke="#222634" stroke-width="1.5" />
    <path d="M -94 28 L -80 38" stroke="#FF7900" stroke-width="3" stroke-linecap="round" />

    <!-- Right Sleeve -->
    <path d="M 54 -38 L 94 28 C 98 34, 86 42, 80 38 L 50 0 L 50 50 Z"
          fill="url(#hoodieBodyGrad)" stroke="#222634" stroke-width="1.5" />
    <path d="M 94 28 L 80 38" stroke="#FF7900" stroke-width="3" stroke-linecap="round" />

    <!-- Main Torso Body -->
    <path d="M -54 -38 L 54 -38 L 58 75 C 58 80, -58 80, -58 75 Z"
          fill="url(#hoodieBodyGrad)" stroke="#2C3242" stroke-width="1.5" />

    <!-- Ribbed Bottom Hem -->
    <rect x="-58" y="70" width="116" height="12" rx="3" fill="#151720" stroke="#FF7900" stroke-width="1.5" opacity="0.85" />

    <!-- Kangaroo Tech Pocket -->
    <path d="M -42 28 L 42 28 L 34 68 L -34 68 Z"
          fill="#161922" stroke="rgba(255, 121, 0, 0.75)" stroke-width="1.5" />
    <!-- Pocket Slits -->
    <line x1="-38" y1="36" x2="-32" y2="60" stroke="#FF9A32" stroke-width="1.5" stroke-linecap="round" />
    <line x1="38" y1="36" x2="32" y2="60" stroke="#FF9A32" stroke-width="1.5" stroke-linecap="round" />

    <!-- Chest Design Chevron & Trikomi Mark -->
    <path d="M -30 -14 L 0 5 L 30 -14" fill="none" stroke="#FF7900" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#orangeGlow)" />
    <polygon points="0,-18 -6,-10 6,-10" fill="#FFFFFF" />

    <!-- Drawstrings -->
    <path d="M -10 -25 Q -14 0 -12 18" fill="none" stroke="#FF9A32" stroke-width="2.2" stroke-linecap="round" />
    <rect x="-14" y="18" width="4" height="7" rx="1.5" fill="#FF7900" />

    <path d="M 10 -25 Q 14 0 12 22" fill="none" stroke="#FF9A32" stroke-width="2.2" stroke-linecap="round" />
    <rect x="10" y="22" width="4" height="7" rx="1.5" fill="#FF7900" />
  </g>
</svg>
