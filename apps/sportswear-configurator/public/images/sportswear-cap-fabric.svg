<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="fabBgGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#FF7900" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#FF9A32" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#08090B" stop-opacity="0" />
    </radialGradient>

    <!-- Platform Gradient -->
    <radialGradient id="fabPlatGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262C3A" />
      <stop offset="70%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0A0C10" />
    </radialGradient>

    <!-- Technical Mesh Texture Pattern -->
    <pattern id="fabMeshPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2" fill="#FF7900" opacity="0.35" />
      <circle cx="0" cy="0" r="1.5" fill="#FF9A32" opacity="0.2" />
      <circle cx="12" cy="0" r="1.5" fill="#FF9A32" opacity="0.2" />
      <circle cx="0" cy="12" r="1.5" fill="#FF9A32" opacity="0.2" />
      <circle cx="12" cy="12" r="1.5" fill="#FF9A32" opacity="0.2" />
    </pattern>

    <!-- Knit Ribbed Pattern -->
    <pattern id="fabKnitPattern" width="8" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 0 Q 4 4 8 0 M 0 8 Q 4 12 8 8 M 0 16 Q 4 20 8 16" fill="none" stroke="rgba(255,154,50,0.3)" stroke-width="1.2" />
    </pattern>

    <!-- Orange Neon Glow -->
    <filter id="fabGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow -->
    <filter id="fabShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="360" fill="#0C0E14" />
  <rect width="480" height="360" fill="url(#fabBgGlow)" />

  <!-- Floor Glow & Platform -->
  <ellipse cx="240" cy="295" rx="160" ry="32" fill="#FF7900" opacity="0.12" filter="url(#fabGlow)" />
  <ellipse cx="240" cy="292" rx="140" ry="26" fill="url(#fabPlatGrad)" stroke="#FF9A32" stroke-width="1.75" filter="drop-shadow(0 0 12px rgba(255,121,0,0.45))" />
  <ellipse cx="240" cy="292" rx="115" ry="18" fill="none" stroke="rgba(255,154,50,0.3)" stroke-width="1" />

  <!-- 3 Cascading Fabric Swatch Cards (Perspective) -->
  <g filter="url(#fabShadow)" transform="translate(240, 150)">
    <!-- Swatch 1 (Left - Interlock Knit) -->
    <g transform="translate(-75, 10) rotate(-12)">
      <rect x="-45" y="-65" width="90" height="130" rx="12" fill="#151822" stroke="rgba(255,154,50,0.4)" stroke-width="1.5" />
      <rect x="-40" y="-60" width="80" height="95" rx="8" fill="url(#fabKnitPattern)" />
      <!-- Label Tag -->
      <rect x="-35" y="42" width="70" height="16" rx="4" fill="#0C0E14" stroke="#FF9A32" stroke-width="1" />
      <text x="0" y="53" fill="#FF9A32" font-size="9" font-family="sans-serif" font-weight="700" text-anchor="middle">INTERLOCK</text>
    </g>

    <!-- Swatch 2 (Right - Poly Smooth Sheen) -->
    <g transform="translate(75, 10) rotate(12)">
      <rect x="-45" y="-65" width="90" height="130" rx="12" fill="#141720" stroke="rgba(255,121,0,0.4)" stroke-width="1.5" />
      <!-- Satin sheen gradient -->
      <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1A1E28" />
        <stop offset="45%" stop-color="#2D3446" />
        <stop offset="55%" stop-color="#FF7900" stop-opacity="0.3" />
        <stop offset="100%" stop-color="#12151D" />
      </linearGradient>
      <rect x="-40" y="-60" width="80" height="95" rx="8" fill="url(#sheenGrad)" />
      <!-- Diagonal highlight line -->
      <line x1="-30" y1="20" x2="30" y2="-40" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" />
      <!-- Label Tag -->
      <rect x="-35" y="42" width="70" height="16" rx="4" fill="#0C0E14" stroke="#FF7900" stroke-width="1" />
      <text x="0" y="53" fill="#FF7900" font-size="9" font-family="sans-serif" font-weight="700" text-anchor="middle">POLY SHEEN</text>
    </g>

    <!-- Swatch 3 (Center - Technical Aerated Mesh - Front & Elevated) -->
    <g transform="translate(0, -10)">
      <rect x="-55" y="-80" width="110" height="155" rx="14" fill="#1A1E29" stroke="#FF7900" stroke-width="2" filter="url(#fabGlow)" />
      <rect x="-50" y="-75" width="100" height="115" rx="10" fill="#11131B" />
      <rect x="-50" y="-75" width="100" height="115" rx="10" fill="url(#fabMeshPattern)" />
      
      <!-- Luminous Corner Accent -->
      <circle cx="-42" cy="-67" r="4" fill="#FF7900" />
      <circle cx="42" cy="-67" r="4" fill="#FF9A32" />

      <!-- Center Magnifying Glass Loupe inspecting weave -->
      <g transform="translate(0, -15)">
        <circle cx="0" cy="0" r="28" fill="rgba(255, 121, 0, 0.15)" stroke="#FF7900" stroke-width="2" />
        <circle cx="0" cy="0" r="24" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6" />
        <!-- Magnified Mesh Matrix -->
        <circle cx="-10" cy="-10" r="3.5" fill="#FF7900" />
        <circle cx="10" cy="-10" r="3.5" fill="#FF9A32" />
        <circle cx="-10" cy="10" r="3.5" fill="#FF9A32" />
        <circle cx="10" cy="10" r="3.5" fill="#FF7900" />
        <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" />
      </g>

      <!-- Label Pill -->
      <rect x="-45" y="48" width="90" height="20" rx="5" fill="#0E1017" stroke="#FF7900" stroke-width="1.5" />
      <text x="0" y="62" fill="#FFFFFF" font-size="10" font-family="sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.5">TECHNICAL MESH</text>
    </g>
  </g>
</svg>
