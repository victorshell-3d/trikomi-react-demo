  <style>

      margin-bottom: 24px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);

      100% {
        transform: rotate(360deg);
      }
    }

    .spinner-text {
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #888;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 1;
      }
    }
  </style>
</head>
